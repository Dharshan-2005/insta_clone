worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    client_max_body_size 50m;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        set $frontend      frontend:3000;
        set $api_gateway   api-gateway:3051;
        set $notifications notification-service:4005;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /media/ {
            alias /usr/share/nginx/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=auth burst=30 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_gateway;
        }

        location /api/ {
            limit_req zone=api burst=200 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_gateway;
            proxy_read_timeout 60s;
        }

        location /socket.io/ {
            proxy_pass http://$notifications;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            proxy_pass http://$frontend;
        }
    }
}
