apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: instagram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: instagram-clone-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: DATABASE_URL
              value: "postgresql://instagram:instagram_secret@postgres:5432/auth_db?schema=public"
            - name: JWT_SECRET
              value: "super-secret-jwt-key-for-dev"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: FRONTEND_URL
              value: "http://localhost:3050"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: instagram
spec:
  type: ClusterIP
  ports:
    - port: 4001
      targetPort: 4001
  selector:
    app: auth-service
