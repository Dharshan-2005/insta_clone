apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: instagram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: instagram-clone-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3051
          env:
            - name: PORT
              value: "3051"
            - name: JWT_SECRET
              value: "super-secret-jwt-key-for-dev"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:4001"
            - name: USER_SERVICE_URL
              value: "http://user-service:4002"
            - name: POST_SERVICE_URL
              value: "http://post-service:4003"
            - name: FEED_SERVICE_URL
              value: "http://feed-service:4004"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:4005"
            - name: FRONTEND_URL
              value: "http://localhost:3050"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3051
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: instagram
spec:
  type: ClusterIP
  ports:
    - port: 3051
      targetPort: 3051
  selector:
    app: api-gateway
