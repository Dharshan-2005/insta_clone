apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-service
  namespace: instagram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feed-service
  template:
    metadata:
      labels:
        app: feed-service
    spec:
      containers:
        - name: feed-service
          image: instagram-clone-feed-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4004
          env:
            - name: PORT
              value: "4004"
            - name: DATABASE_URL
              value: "postgresql://instagram:instagram_secret@postgres:5432/feed_db?schema=public"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: USER_SERVICE_URL
              value: "http://user-service:4002"
            - name: POST_SERVICE_URL
              value: "http://post-service:4003"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: feed-service
  namespace: instagram
spec:
  type: ClusterIP
  ports:
    - port: 4004
      targetPort: 4004
  selector:
    app: feed-service
