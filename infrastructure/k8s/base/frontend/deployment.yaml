apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: instagram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: instagram-clone-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3050
          env:
            - name: PORT
              value: "3050"
            - name: NEXTAUTH_URL
              value: "http://localhost:3050"
            - name: AUTH_SECRET
              value: "default_auth_secret_for_dev_session_32bytes"
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: "http://localhost:3051/api"
            - name: NEXT_PUBLIC_MEDIA_URL
              value: "http://localhost/media"
            - name: NEXT_PUBLIC_WS_URL
              value: "http://localhost:4005/ws"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3050
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3050
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: instagram
spec:
  type: ClusterIP
  ports:
    - port: 3050
      targetPort: 3050
  selector:
    app: frontend
