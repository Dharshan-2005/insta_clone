apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
  namespace: instagram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      containers:
        - name: post-service
          image: instagram-clone-post-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
            - name: DATABASE_URL
              value: "postgresql://instagram:instagram_secret@postgres:5432/post_db?schema=public"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: UPLOAD_DIR
              value: "/uploads"
          volumeMounts:
            - name: media-storage
              mountPath: /uploads
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: post-service
  namespace: instagram
spec:
  type: ClusterIP
  ports:
    - port: 4003
      targetPort: 4003
  selector:
    app: post-service
