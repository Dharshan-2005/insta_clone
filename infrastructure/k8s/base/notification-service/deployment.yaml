apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: instagram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: instagram-clone-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4005
          env:
            - name: PORT
              value: "4005"
            - name: DATABASE_URL
              value: "postgresql://instagram:instagram_secret@postgres:5432/notification_db?schema=public"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: USER_SERVICE_URL
              value: "http://user-service:4002"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: instagram
spec:
  type: ClusterIP
  ports:
    - port: 4005
      targetPort: 4005
  selector:
    app: notification-service
