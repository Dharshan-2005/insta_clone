name: instagram-clone

x-node-service: &node-service
  restart: unless-stopped
  init: true

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-environment:
  jwt-secret: &jwt-secret ${JWT_SECRET:-local-development-secret-change-me}
  seed-demo-data: &seed-demo-data ${SEED_DEMO_DATA:-true}
  kafka-brokers: &kafka-brokers kafka:9092

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: instagram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-instagram}
      POSTGRES_DB: instagram
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instagram -d instagram"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  user-service:
    <<: *node-service
    build:
      context: ./services/user-service
      dockerfile: ../Dockerfile
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://instagram:${POSTGRES_PASSWORD:-instagram}@postgres:5432/user_db
      KAFKA_BROKERS: *kafka-brokers
      UPLOAD_DIR: /app/uploads
      SEED_DEMO_DATA: *seed-demo-data
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4002/health"]

  auth-service:
    <<: *node-service
    build:
      context: ./services/auth-service
      dockerfile: ../Dockerfile
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://instagram:${POSTGRES_PASSWORD:-instagram}@postgres:5432/auth_db
      JWT_SECRET: *jwt-secret
      USER_SERVICE_URL: http://user-service:4002
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_DATA: *seed-demo-data
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4001/health"]

  post-service:
    <<: *node-service
    build:
      context: ./services/post-service
      dockerfile: ../Dockerfile
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://instagram:${POSTGRES_PASSWORD:-instagram}@postgres:5432/post_db
      KAFKA_BROKERS: *kafka-brokers
      USER_SERVICE_URL: http://user-service:4002
      UPLOAD_DIR: /app/uploads
      SEED_DEMO_DATA: *seed-demo-data
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4003/health"]

  notification-service:
    <<: *node-service
    build:
      context: ./services/notification-service
      dockerfile: ../Dockerfile
    environment:
      PORT: 4005
      DATABASE_URL: postgresql://instagram:${POSTGRES_PASSWORD:-instagram}@postgres:5432/notification_db
      JWT_SECRET: *jwt-secret
      KAFKA_BROKERS: *kafka-brokers
      USER_SERVICE_URL: http://user-service:4002
      UPLOAD_DIR: /app/uploads
      SEED_DEMO_DATA: *seed-demo-data
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4005/health"]

  api-gateway:
    <<: *node-service
    build:
      context: ./services/api-gateway
      dockerfile: ../Dockerfile
    environment:
      PORT: 3051
      JWT_SECRET: *jwt-secret
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:4002
      POST_SERVICE_URL: http://post-service:4003
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3051/health"]

  frontend:
    <<: *node-service
    build: ./frontend
    environment:
      API_URL: http://api-gateway:3051
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/auth/login"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/usr/share/nginx/media:ro
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/nginx-health"]

volumes:
  postgres_data:
